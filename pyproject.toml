[project]
name = "transformagent"
version = "0.1.0"
description = "Screen-region translation for Windows"
requires-python = ">=3.13,<3.14"
dependencies = [
    "keyring>=25,<26",
    "mss>=10.2,<11",
    "numpy>=2,<3",
    "onnxruntime>=1.22,<2",
    "opencv-python-headless>=4.11,<5",
    "pyside6-essentials>=6.8,<7",
    "rapidocr==3.10.0",
]

[project.gui-scripts]
transformagent = "transformagent.app:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pillow>=11,<13", "pyinstaller>=6.15,<7", "pytest>=8,<10"]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["desktop: requires an unlocked interactive Windows desktop"]
